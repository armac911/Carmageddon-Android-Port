apply plugin: 'com.android.application'

android {
    namespace "com.dethrace.android"
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.androgaming.carma.next"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 26
        versionName "0.9.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-24",
                          "-DCMAKE_BUILD_TYPE=Release"
                cFlags "-O2"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// The installer reader is an Android PIE packaged in the read-only native lib directory.
tasks.named("preBuild").configure {
    doFirst {
        if (!file("libs/arm64-v8a/libinnoextract.so").isFile()) {
            throw new GradleException("Missing installer helper: run android/scripts/setup-importer.sh first")
        }
    }
}
